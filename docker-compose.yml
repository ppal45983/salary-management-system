version: '3.8'

services:
  # MySQL 8.0 Relational Database
  db:
    image: mysql:8.0
    container_name: sms-mysql
    restart: always
    environment:
      MYSQL_DATABASE: salary_management_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/01_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/sql/02_seed_tax_brackets.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sms-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/salary_management_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # Angular 16 Frontend (Production Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sms-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
