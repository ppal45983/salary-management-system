spring:
  application:
    name: salary-management-system
    
  datasource:
    url: jdbc:mysql://localhost:3306/salary_management_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 10
          fetch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false
    
  mvc:
    throw-exception-if-no-handler-found: true
    dispatch-options-request: true
    
  web:
    resources:
      add-mappings: true

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:SecureSecretKeyForJWTTokenSigningPurposeMinimum256BitsRequiredForHS256}
    expiration: ${JWT_EXPIRATION:86400000}  # 24 hours in milliseconds
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days

# Logging Configuration
logging:
  level:
    root: INFO
    com.sms: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/salary-management-system.log
    max-size: 10MB
    max-history: 30

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api/v1
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  error:
    include-stacktrace: on-param
    include-message: always

# Actuator Configuration for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: when-authorized
