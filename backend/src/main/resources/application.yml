spring:
  application:
    name: salary-management-system
  main:
    allow-bean-definition-overriding: true
    
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/salary_management_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 0
    
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 10
          fetch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false
    
  mvc:
    throw-exception-if-no-handler-found: true
    dispatch-options-request: true
    
  web:
    resources:
      add-mappings: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method

# Application Configurations
app:
  jwt:
    secret: ${JWT_SECRET:SecureSecretKeyForJWTTokenSigningPurposeMinimum256BitsRequiredForHS256}
    expiration: ${JWT_EXPIRATION:86400000}  # 24 hours in milliseconds
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,https://salary-management-system-793w3p9r5-ppal45983s-projects.vercel.app}

# Logging Configuration
logging:
  level:
    root: INFO
    com.sms: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/salary-management-system.log
    max-size: 10MB
    max-history: 30

# Server Configuration
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  error:
    include-stacktrace: on-param
    include-message: always

# Actuator Configuration for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always
